name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v?(\d+)\.(\d+)\.(\d+)$') {
            throw "Tag '$tag' does not look like v1.2.3"
          }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          $manifestPath = "LlmExtension/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = $version
          $manifest.Save((Join-Path $PWD $manifestPath))
          "Stamped package version $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Import signing certificate
        shell: pwsh
        env:
          MSIX_CERT_B64: ${{ secrets.MSIX_SIGNING_CERT }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:MSIX_CERT_B64) {
            throw "Secret MSIX_SIGNING_CERT is not configured. Generate a self-signed certificate whose subject matches the Publisher in Package.appxmanifest (CN=MikaKrul) and store it base64-encoded in this repo secret."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:MSIX_CERT_B64))
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new("$env:RUNNER_TEMP\signing.pfx", $env:MSIX_CERT_PASSWORD)
          [IO.File]::WriteAllBytes("LlmExtension.cer", $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      - name: Build MSIX
        shell: pwsh
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}
        run: |
          msbuild LlmExtension/LlmExtension.csproj /restore `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:RUNNER_TEMP\out" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\signing.pfx" `
            /p:PackageCertificatePassword="$env:MSIX_CERT_PASSWORD"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}\out\**\*.msix
            ${{ runner.temp }}\out\**\*.cer
            LlmExtension.cer
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
